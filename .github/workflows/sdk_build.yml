name: build

on: 
  push:
    branches:
      - master
      - release-*
      - dev-*
      - feature-*
    tags:
      - v*
    
  pull_request:
    branches: 
      - master
      - release-*
      - dev-*
      - feature-*

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      NUPKG_OUTDIR: bin/Release/nugets
    steps:
      - uses: actions/checkout@v6
        with:
          clean: true
      - name: Parse release version
        run: python ./.github/scripts/get_release_version.py
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          dotnet-quality: 'ga'
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration release --no-restore
      - name: Generate Packages
        run: dotnet pack --configuration release
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: ${{ env.NUPKG_OUTDIR }}

  discover-integration-v2-tests:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.set-matrix.outputs.projects }}
    steps:
      - uses: actions/checkout@v6
      - id: set-matrix
        shell: bash
        run: |
          set -euo pipefail
  
          PROJECTS_JSON=$(
            find test -name "Dapr.IntegrationTest.*.csproj" ! -name "*E2E*" -print0 \
            | jq -Rs -c '
              split("\u0000")[:-1]
              | map({
                project: .,
                projectName: (
                  .
                  | gsub("\\\\"; "/")                       # normalize \ to /
                  | split("/") | last                       # basename
                  | sub("\\.csproj$"; "")                   # strip extension
                  | sub("^Dapr\\.IntegrationTest\\."; "")   # drop prefix once
                )
              })
            '
          )
          printf 'projects=%s\n' "${PROJECTS_JSON}" >> "$GITHUB_OUTPUT"

  discover-unit-test-projects:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: set-matrix
        run: |
          # Find all csproj files matching the pattern recursively
          PROJECTS=$(find test -name "Dapr.*.Test.csproj" ! -name "*E2E*" | jq -R -s -c 'split("\n")[:-1]')
          echo "matrix=$PROJECTS" >> $GITHUB_OUTPUT

  get-dapr-versions:
    runs-on: ubuntu-latest
    outputs:
      matrix_json: ${{ steps.compute.outputs.matrix_json }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: .github/tools/tag-selector/package-lock.json
      - working-directory: .github/tools/tag-selector
        run: npm ci && npm test && npm run build
      - id: compute
        name: Run selector
        env:
          INPUT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG_PREFIX: "v"
          INPUT_STABLE_COUNT: "3"
          INPUT_RC_COUNT: "1"
          INPUT_RC_IDENTIFIER: "rc"
        run: |
          node .github/tools/tag-selector/dist/index.js
      - name: Show outputs
        run: |
          echo "Matrix: ${{ steps.compute.outputs.matrix_json }}"

  compute-integration-matrix:
    runs-on: ubuntu-latest
    needs: [ discover-integration-v2-tests, get-dapr-versions ]
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - id: build
        shell: bash
        run: |
          set -euo pipefail

          # Pull upstream outputs (may be empty)
          projects_raw='${{ needs.discover-integration-v2-tests.outputs.projects }}'
          dapr_raw='${{ needs.get-dapr-versions.outputs.matrix_json }}'

          # Default empty to valid JSON arrays to avoid null iteration
          if [ -z "${projects_raw}" ] || [ "${projects_raw}" = "null" ]; then
            projects_raw='[]'
          fi
          if [ -z "${dapr_raw}" ] || [ "${dapr_raw}" = "null" ]; then
            dapr_raw='[]'
          fi

          # Static axes
          dotnets='[
            {"dotnet-version":"8.0", "display-name":".NET 8.0", "framework":"net8.0", "prefix":"net8", "install-version":"8.0.x", "upload_coverage": false},
            {"dotnet-version":"9.0", "display-name":".NET 9.0", "framework":"net9.0", "prefix":"net9", "install-version":"9.0.x", "upload_coverage": false},
            {"dotnet-version":"10.0", "display-name":".NET 10.0", "framework":"net10.0", "prefix":"net10", "install-version":"10.0.x", "upload_coverage": true}
          ]'
          oss='["ubuntu-latest"]'

          # Normalize dapr to an array:
          # - if it's already an array, use as-is
          # - if it's an object with "include", use .include
          # - if it's a single object, wrap in an array
          dapr_array=$(
            jq -cn --argjson d "$dapr_raw" '
              if ($d|type) == "array" then
                $d
              elif ($d|type) == "object" and ($d|has("include")) then
                $d.include
              elif ($d|type) == "object" then
                [$d]
              else
                []
              end
            '
          )

          # Sanity logs (optional)
          echo "Projects: $projects_raw"
          echo "Dapr (normalized): $dapr_array"

          # Build the full cross-product into { include: [...] }
          matrix_json=$(
            jq -cn \
              --argjson projects "$projects_raw" \
              --argjson dotnets "$dotnets" \
              --argjson oss "$oss" \
              --argjson dapr "$dapr_array" '
                [
                  $projects[] as $p
                  | $dotnets[] as $d
                  | $oss[] as $o
                  | $dapr[] as $dv
                  | {
                      # from discovery
                      project: $p.project,
                      projectName: $p.projectName,

                      # from dotnet axis
                      "dotnet-version": $d["dotnet-version"],
                      "display-name":   $d["display-name"],
                      framework:        $d.framework,
                      prefix:           $d.prefix,
                      "install-version":$d["install-version"],

                      # from OS axis
                      os: $o,

                      # from Dapr selector (assumes objects like { "version": "v1.17.0-rc.2", ... })
                      "dapr-runtime-versions": $dv
                    }
                ]
                | { include: . }
              '
          )

          printf 'matrix=%s\n' "$matrix_json" >> "$GITHUB_OUTPUT"

  compute-integration-matrix-net11:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [ discover-integration-v2-tests, get-dapr-versions ]
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - id: build
        shell: bash
        run: |
          set -euo pipefail

          projects_raw='${{ needs.discover-integration-v2-tests.outputs.projects }}'
          dapr_raw='${{ needs.get-dapr-versions.outputs.matrix_json }}'

          if [ -z "${projects_raw}" ] || [ "${projects_raw}" = "null" ]; then
            projects_raw='[]'
          fi
          if [ -z "${dapr_raw}" ] || [ "${dapr_raw}" = "null" ]; then
            dapr_raw='[]'
          fi

          dotnets='[
            {"dotnet-version":"11.0", "display-name":".NET 11.0", "framework":"net11.0", "prefix":"net11", "install-version":"11.0.x"}
          ]'
          oss='["ubuntu-latest"]'

          dapr_array=$(
            jq -cn --argjson d "$dapr_raw" '
              if ($d|type) == "array" then
                $d
              elif ($d|type) == "object" and ($d|has("include")) then
                $d.include
              elif ($d|type) == "object" then
                [$d]
              else
                []
              end
            '
          )

          matrix_json=$(
            jq -cn \
              --argjson projects "$projects_raw" \
              --argjson dotnets "$dotnets" \
              --argjson oss "$oss" \
              --argjson dapr "$dapr_array" '
                [
                  $projects[] as $p
                  | $dotnets[] as $d
                  | $oss[] as $o
                  | $dapr[] as $dv
                  | {
                      project: $p.project,
                      projectName: $p.projectName,
                      "dotnet-version": $d["dotnet-version"],
                      "display-name":   $d["display-name"],
                      framework:        $d.framework,
                      prefix:           $d.prefix,
                      "install-version":$d["install-version"],
                      os: $o,
                      "dapr-runtime-versions": $dv
                    }
                ]
                | { include: . }
              '
          )

          printf 'matrix=%s\n' "$matrix_json" >> "$GITHUB_OUTPUT"

  integration-tests-v2:
    name: ${{ matrix.prefix }}-${{ matrix['dapr-runtime-versions'].version }}-${{ matrix.projectName }}
    needs: [ compute-integration-matrix ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.compute-integration-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - name: Parse release version
        run: python ./.github/scripts/get_release_version.py
      - name: Setup ${{ matrix.display-name }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.install-version }}
          dotnet-quality: 'ga' # Prefer a GA release, but use the RC if not available
      - name: Integration Tests
        id: integration-tests-v2
        continue-on-error: false # proceed if tests fail to allow for the report generation in master or next step failure in PR
        env:
          DAPR_RUNTIME_VERSION: ${{ matrix.dapr-runtime-versions.version }}
        run: |
          dotnet test "${{ matrix.project }}" \
          --configuration release \
          --framework ${{ matrix.framework }} \
          --logger "trx;LogFilePrefix=${{ matrix.prefix }}" \
          --logger "GitHubActions;report-warnings=false" \
          --logger "console;verbosity=detailed" \
          --results-directory "${{ github.workspace }}/TestResults" \
          /p:RuntimeIdentifier=linux-x64 \
          /p:CollectCoverage=true \
          /p:CoverletOutputFormat=opencover \
          /p:GITHUB_ACTIONS=false
        timeout-minutes: 60
      - name: Upload test coverage
        if: ${{ matrix.upload_coverage == true }}
        uses: codecov/codecov-action@v1
        with:
          flags: ${{ matrix.framework }}
          token: ${{ secrets.CODECOV_API_KEY }}
      - name: Parse Trx files
        uses: NasAmin/trx-parser@v0.2.0
        id: trx-parser
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository # does not work on PRs from forks
        with:
          TRX_PATH: ${{ github.workspace }}/TestResults
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  integration-tests-net11:
    name: ${{ matrix.prefix }}-${{ matrix['dapr-runtime-versions'].version }}-${{ matrix.projectName }}
    needs: [ compute-integration-matrix-net11 ]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.compute-integration-matrix-net11.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - name: Remove global.json (use .NET 11 preview SDK)
        run: rm global.json
      - name: Setup ${{ matrix.display-name }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.install-version }}
          dotnet-quality: 'preview'
      - name: Integration Tests
        id: integration-tests-net11
        continue-on-error: false
        env:
          DAPR_RUNTIME_VERSION: ${{ matrix.dapr-runtime-versions.version }}
          DaprEnableNet11: 'true'
        run: |
          dotnet test "${{ matrix.project }}" \
          --configuration release \
          --framework ${{ matrix.framework }} \
          --logger "trx;LogFilePrefix=${{ matrix.prefix }}" \
          --logger "GitHubActions;report-warnings=false" \
          --logger "console;verbosity=detailed" \
          --results-directory "${{ github.workspace }}/TestResults" \
          /p:RuntimeIdentifier=linux-x64 \
          /p:CollectCoverage=true \
          /p:CoverletOutputFormat=opencover \
          /p:GITHUB_ACTIONS=false
        timeout-minutes: 60
      - name: Parse Trx files
        uses: NasAmin/trx-parser@v0.2.0
        id: trx-parser
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository # does not work on PRs from forks
        with:
          TRX_PATH: ${{ github.workspace }}/TestResults
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ci-integration-tests-gate:
    runs-on: ubuntu-latest
    needs: [integration-tests-v2, integration-test, integration-tests-net11]
    steps:
      - name: "All integration tests passed"
        run: echo "All unit tests passed"
  unit-tests:
    name: Unit Tests ${{ matrix.display-name }} / ${{ matrix.os }} - ${{ matrix.project}}
    needs: discover-unit-test-projects
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dotnet-version: ['8.0', '9.0', '10.0']
        project: ${{ fromJson(needs.discover-unit-test-projects.outputs.matrix) }}
        include:
        - dotnet-version: '8.0'
          display-name: '.NET 8.0'
          framework: 'net8.0'
          prefix: 'net8'
          install-version: '8.0.x'
          upload_coverage: false
        - dotnet-version: '9.0'
          display-name: '.NET 9.0'
          framework: 'net9.0'
          prefix: 'net9'
          install-version: '9.0.x'
          upload_coverage: false
        - dotnet-version: '10.0'
          display-name: '.NET 10.0'
          framework: 'net10.0'
          prefix: 'net10'
          install-version: '10.0.x'
          upload_coverage: true
    steps:
    - uses: actions/checkout@v6
    - name: Parse release version
      run: python ./.github/scripts/get_release_version.py
    - name: Setup ${{ matrix.display-name }}
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ matrix.install-version }}
        dotnet-quality: 'ga' # Prefer a GA release, but use the RC if not available
    - name: Test
      id: tests
      continue-on-error: true # proceed if tests fail to allow for the report generation in master or next step failure in PR
      run: |
        dotnet test "${{ matrix.project }}"  \
        --configuration release \
        --framework ${{ matrix.framework }} \
        --logger "trx;LogFilePrefix=${{ matrix.prefix }}" \
        --logger "GitHubActions;report-warnings=false" \
        --logger "console;verbosity=detailed" \
        --results-directory "${{ github.workspace }}/TestResults" \
        /p:RuntimeIdentifier=linux-x64 \
        /p:CollectCoverage=true \
        /p:CoverletOutputFormat=opencover \
        /p:GITHUB_ACTIONS=false
      timeout-minutes: 60
    - name: Check test failure in PR
      if: github.event_name == 'pull_request' && steps.tests.outcome != 'success'
      run: exit 1
    - name: Upload test coverage
      if: ${{ matrix.upload_coverage == true }}
      uses: codecov/codecov-action@v1
      with:
        flags: ${{ matrix.framework }}
        token: ${{ secrets.CODECOV_API_KEY }}
    - name: Parse Trx files
      uses: NasAmin/trx-parser@v0.2.0
      id: trx-parser
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository # does not work on PRs from forks
      with:
        TRX_PATH: ${{ github.workspace }}/TestResults
        REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  unit-tests-net11:
    name: Unit Tests .NET 11.0 / ${{ matrix.project }}
    needs: discover-unit-test-projects
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover-unit-test-projects.outputs.matrix) }}
    steps:
    - uses: actions/checkout@v6
    - name: Remove global.json (use .NET 11 preview SDK)
      run: rm global.json
    - name: Setup .NET 11.0
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '11.0.x'
        dotnet-quality: 'preview'
    - name: Test
      env:
        DaprEnableNet11: 'true'
      id: tests
      continue-on-error: false
      run: |
        dotnet test "${{ matrix.project }}"  \
        --configuration release \
        --framework net11.0 \
        --logger "trx;LogFilePrefix=net11" \
        --logger "GitHubActions;report-warnings=false" \
        --logger "console;verbosity=detailed" \
        --results-directory "${{ github.workspace }}/TestResults" \
        /p:RuntimeIdentifier=linux-x64 \
        /p:CollectCoverage=true \
        /p:CoverletOutputFormat=opencover \
        /p:GITHUB_ACTIONS=false
      timeout-minutes: 60
    - name: Parse Trx files
      uses: NasAmin/trx-parser@v0.2.0
      id: trx-parser
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository # does not work on PRs from forks
      with:
        TRX_PATH: ${{ github.workspace }}/TestResults
        REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ci-unit-tests-gate:
    runs-on: ubuntu-latest
    needs: [unit-tests, unit-tests-net11]
    steps:
      - name: "All unit tests passed"
        run: echo "All unit tests passed"
  integration-test:
    uses: ./.github/workflows/itests.yml
  discover:
    name: 'Discover Packages'
    needs: ['build', 'ci-unit-tests-gate', 'ci-integration-tests-gate']
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages
      - name: List packages
        run: ls packages/*.nupkg
      - name: Generate matrix
        id: set-matrix
        run: |
          echo "Generating package matrix..."
          files=$(ls packages/*.nupkg | jq -R -s -c '
            split("\n")[:-1]
            | map(select(
                ((test("/Dapr\\.Workflow\\.Versioning\\.(Abstractions|Generators|Runtime)\\.")) | not) and
                ((test("/Dapr\\.SecretsManagement\\.(Abstractions|Generators|Runtime)\\.")) | not)
              ))
            | map(select(
                (test("/Dapr\\.StateManagement\\.(Abstractions|Generators|Runtime)\\.")) | not
              ))
          ')
          echo "matrix=$files" >> $GITHUB_OUTPUT

  publish:
    permissions:
      id-token: write # Enable GitHub OIDC token issuance for this job
    name: Publish Packages
    needs: ['discover']
    if: |
      startswith(github.ref, 'refs/tags/v') &&
      !(endsWith(github.ref, '-rc') || endsWith(github.ref, '-dev') || endsWith(github.ref, '-prerelease'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages
      - name: NuGet logic (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGETORG_DAPR_USER }}
      - name: Publish ${{ matrix.package }} to NuGet
        run: |
          dotnet nuget push "${{ matrix.package }}" --skip-duplicate --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
 

  # Opens (or comments on) a tracking issue only when the publish job (NuGet
  # push) itself fails. Any upstream build/test failure skips publish, whose
  # result is then 'skipped' (not 'failure'), so CI flakes never open issues.
  # Prerelease tags (-rc/-dev/-prerelease) are excluded to match the publish job.
  notify-on-failure:
    needs: [publish]
    if: always() && startsWith(github.ref, 'refs/tags/v') && !(endsWith(github.ref, '-rc') || endsWith(github.ref, '-dev') || endsWith(github.ref, '-prerelease')) && needs.publish.result == 'failure'
    permissions:
      issues: write
      actions: read
    uses: dapr/.github/.github/workflows/open-issue-on-failure.yml@main
    with:
      title: "Release workflow failed: ${{ github.workflow }} (${{ github.ref_name }})"
      labels: "release,ci/release-failure"
      mention: "@dapr/maintainers-dotnet-sdk @dapr/approvers-dotnet-sdk"
