# Dapr multi-app run file: runs the bulk state sample (3) with a sidecar that REQUIRES an API token.
#
#   dapr run -f dapr-with-token.yaml
#
# "env" is applied by the Dapr CLI to both daprd and the app: daprd enables API token authentication
# and rejects every call without the "dapr-api-token" header, while DaprClientBuilder reads
# DAPR_API_TOKEN and adds the header to every call. Useful to verify that each DaprClient method
# forwards the token (see https://github.com/dapr/dotnet-sdk/issues/1282).
#
# Change the last element of "command" to run a different sample (see Program.cs for the list).
version: 1
apps:
  - appID: DaprClient
    appDirPath: .
    daprGRPCPort: 50001
    appLogDestination: console
    daprdLogDestination: console
    command: ["dotnet", "run", "--framework", "net10.0", "--", "3"]
    env:
      DAPR_API_TOKEN: my-dapr-api-token
